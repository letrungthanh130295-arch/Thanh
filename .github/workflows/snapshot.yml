name: Snapshot xăng dầu
on:
  schedule:
    # UTC -> Viet Nam UTC+7: 06:16, 09:00, 12:00, 15:00
    - cron: "16 23 * * *"
    - cron: "0 2,5,8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["dist/**", "scripts/**", ".github/workflows/snapshot.yml", "package*.json"]
permissions:
  contents: write
concurrency:
  group: fuel-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Lấy nguồn phía server
        id: fetch
        run: node scripts/fetch-snapshot.mjs
      - name: Lưu snapshot kể cả WTI thay đổi nhỏ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m "data: cập nhật snapshot [skip ci]"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: source-status
          path: .run/result.json
      # Chưa deploy: Pages yêu cầu nâng cấp gói cho repo Private.
      # Điều kiện deploy đã được tính và lưu trong .run/result.json.
      # Thêm hosting sau khi chủ trạm chọn Pages hoặc Netlify.
