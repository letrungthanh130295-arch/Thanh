name: Dashboard giá xăng dầu
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["dist/**", "scripts/**", ".github/workflows/snapshot.yml", "package*.json"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: fuel-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ github.event_name == 'push' || steps.refresh.outputs.changed == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Lấy Chợ Giá theo yêu cầu
        if: github.event_name == 'workflow_dispatch'
        id: refresh
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/fetch-snapshot.mjs
            if git diff --quiet -- dist/snapshot.json; then
              exit 0
            fi
            git add dist/snapshot.json
            git commit -m "data: làm mới Chợ Giá"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          exit 1
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' || steps.refresh.outputs.changed == 'true'
        with:
          path: dist
  deploy:
    needs: snapshot
    if: needs.snapshot.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
