name: Snapshot xăng dầu
on:
  schedule:
    # Hourly at minute 05 UTC = minute 05 Viet Nam (UTC+7), 24 runs/day
    - cron: "5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["dist/**", "scripts/**", ".github/workflows/snapshot.yml", "package*.json"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: fuel-snapshot
  cancel-in-progress: false
jobs:
  # Publish every hourly run so the public WTI snapshot stays current even below $1.
  snapshot:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.fetch.outputs.deploy == 'true' || github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Lấy nguồn phía server
        id: fetch
        run: node scripts/fetch-snapshot.mjs
      - name: Ghi trạng thái lịch và hosting
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const p="dist/snapshot.json"; const s=JSON.parse(fs.readFileSync(p,"utf8")); s.operations={schedulerActive:true,hosting:"GitHub Pages",note:"Chợ Giá: mỗi giờ phút 00 qua web; WTI: mỗi giờ phút 05 (UTC+7)"}; fs.writeFileSync(p,JSON.stringify(s,null,2)+"\n");'
      - name: Lưu snapshot (thử lại nếu main vừa được cập nhật)
        shell: bash
        run: |
          set -euo pipefail
          write_operations() {
            node --input-type=module -e 'import fs from "node:fs"; const p="dist/snapshot.json"; const s=JSON.parse(fs.readFileSync(p,"utf8")); s.operations={schedulerActive:true,hosting:"GitHub Pages",note:"Chợ Giá: mỗi giờ phút 00 qua web; WTI: mỗi giờ phút 05 (UTC+7)"}; fs.writeFileSync(p,JSON.stringify(s,null,2)+"\n");'
          }
          save_push() {
            git add dist/snapshot.json
            if git diff --cached --quiet; then
              return 0
            fi
            git commit -m "data: cập nhật snapshot [skip ci]"
            git push origin HEAD:main
          }
          if save_push; then
            exit 0
          fi
          for attempt in 1 2; do
            echo "Push bị xung đột; lấy main mới nhất và đọc lại nguồn (lần thử $attempt/2)"
            git fetch origin main
            git reset --hard origin/main
            node scripts/fetch-snapshot.mjs
            write_operations
            if save_push; then
              exit 0
            fi
          done
          echo "Không thể ghi snapshot sau 3 lần thử." >&2
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: source-status
          path: .run/result.json
      - uses: actions/configure-pages@v5
        if: steps.fetch.outputs.deploy == 'true' || github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      - uses: actions/upload-pages-artifact@v3
        if: steps.fetch.outputs.deploy == 'true' || github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          path: dist
  deploy:
    needs: snapshot
    if: needs.snapshot.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Xuất bản GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
