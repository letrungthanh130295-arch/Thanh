name: Snapshot xăng dầu
on:
  schedule:
    # UTC -> Viet Nam UTC+7: 06:16, 09:00, 12:00, 15:00
    - cron: "16 23 * * *"
    - cron: "0 2,5,8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["dist/**", "scripts/**", ".github/workflows/snapshot.yml", "package*.json"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: fuel-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.fetch.outputs.deploy == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Lấy nguồn phía server
        id: fetch
        run: node scripts/fetch-snapshot.mjs
      - name: Ghi trạng thái lịch và hosting
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const p="dist/snapshot.json"; const s=JSON.parse(fs.readFileSync(p,"utf8")); s.operations={schedulerActive:true,hosting:"GitHub Pages",note:"GitHub Actions: 06:16, 09:00, 12:00, 15:00 Việt Nam"}; fs.writeFileSync(p,JSON.stringify(s,null,2)+"\n");'
      - name: Lưu snapshot kể cả WTI thay đổi nhỏ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m "data: cập nhật snapshot [skip ci]"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: source-status
          path: .run/result.json
      - uses: actions/configure-pages@v5
        if: steps.fetch.outputs.deploy == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      - uses: actions/upload-pages-artifact@v3
        if: steps.fetch.outputs.deploy == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          path: dist
  deploy:
    needs: snapshot
    if: needs.snapshot.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Xuất bản GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
